<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<style>
  :root { --ink: #8fd8ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #01060f; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; color: var(--ink); cursor: none; }
  body.showui { cursor: default; }

  #stage { position: fixed; inset: 0; display: block; }

  #cap {
    position: fixed; left: 50%; bottom: 6.5vh; transform: translateX(-50%);
    max-width: min(780px, 84vw); text-align: center;
    font-size: clamp(13px, 1.5vw, 17px); font-weight: 300; line-height: 1.6;
    color: #bfe9ff; opacity: 0; transition: opacity .7s ease;
    text-shadow: 0 0 26px rgba(90,190,255,.6), 0 2px 12px rgba(0,0,0,.9);
    pointer-events: none; white-space: pre-wrap;
  }
  #cap.on { opacity: .95; }
  #cap.quiet { color: #5f9fc4; font-size: clamp(11px,1.1vw,13px); letter-spacing: .2em; text-transform: uppercase; }

  #ctl { position: fixed; top: 18px; right: 20px; display: flex; gap: 10px; opacity: 0; transition: opacity .35s; pointer-events: none; }
  body.showui #ctl { opacity: 1; pointer-events: auto; }
  .cbtn {
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    background: rgba(10,34,56,.55); border: 1px solid rgba(140,215,255,.3);
    color: #8fd8ff; font-size: 14px; display: grid; place-items: center;
    backdrop-filter: blur(6px); transition: all .2s;
  }
  .cbtn:hover { background: rgba(24,70,104,.85); border-color: rgba(140,215,255,.65); }
  .cbtn.off { color: #2d5a75; border-color: rgba(140,215,255,.13); }

  #badge {
    position: fixed; left: 20px; top: 18px; font-size: 10px; letter-spacing: .22em;
    opacity: 0; transition: opacity .35s; pointer-events: none; text-transform: uppercase;
  }
  body.showui #badge { opacity: .85; }
  #badge b { font-weight: 500; }
  #badge.ok { color: #5f9fc4; }
  #badge.no { color: #d98a5a; }

  #sheet { position: fixed; inset: 0; background: rgba(1,6,15,.88); backdrop-filter: blur(10px); display: none; place-items: center; z-index: 20; }
  #sheet.on { display: grid; }
  #card { width: min(430px,88vw); max-height: 90vh; overflow-y: auto; padding: 28px 30px; background: rgba(7,24,40,.92); border: 1px solid rgba(140,215,255,.24); border-radius: 14px; }
  #card h2 { font-size: 11px; letter-spacing: .4em; font-weight: 400; color: #8fd8ff; margin-bottom: 20px; }
  .f { margin-bottom: 14px; }
  .f label { display: block; font-size: 10.5px; letter-spacing: .14em; color: #5f9fc4; margin-bottom: 6px; }
  .f input, .f select { width: 100%; background: rgba(0,10,20,.7); border: 1px solid rgba(140,215,255,.2); color: #d5f0ff; padding: 9px 11px; border-radius: 7px; font-size: 13px; outline: none; font-family: inherit; }
  .f input:focus, .f select:focus { border-color: rgba(140,215,255,.55); }
  .row { display: flex; gap: 11px; } .row .f { flex: 1; }
  .fin { display: flex; gap: 9px; justify-content: flex-end; margin-top: 20px; }
  .fin button, #s-test { padding: 9px 18px; border-radius: 7px; font-size: 12.5px; cursor: pointer; font-family: inherit; background: none; border: 1px solid rgba(140,215,255,.28); color: #5f9fc4; }
  .fin button.go { background: rgba(140,215,255,.15); color: #8fd8ff; border-color: rgba(140,215,255,.5); }
  #s-test { width: 100%; background: rgba(140,215,255,.08); color: #8fd8ff; }
  .note { font-size: 10.5px; color: #3f7492; line-height: 1.7; margin-top: 5px; }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div id="badge"></div>
<div id="cap"></div>

<div id="ctl">
  <button class="cbtn" id="b-mic" title="음성 대기">🎙</button>
  <button class="cbtn" id="b-new" title="새 대화">↺</button>
  <button class="cbtn" id="b-set" title="설정">⚙</button>
</div>

<div id="sheet"><div id="card">
  <h2>SETTINGS</h2>
  <div class="row">
    <div class="f"><label>호칭</label><input id="s-hon" placeholder="보스"></div>
    <div class="f"><label>웨이크워드</label><input id="s-wake" placeholder="자비스"></div>
  </div>
  <div class="f"><label>목소리</label><select id="s-voice"><option value="">자동 선택</option></select></div>
  <div class="row">
    <div class="f"><label>속도</label><select id="s-rate">
      <option value="0.8">아주 느리게</option><option value="0.9">느리게</option>
      <option value="1.05">보통</option><option value="1.2">빠르게</option><option value="1.4">아주 빠르게</option>
    </select></div>
    <div class="f"><label>음높이</label><select id="s-pitch">
      <option value="0.7">아주 낮게</option><option value="0.85">낮게</option>
      <option value="1">보통</option><option value="1.2">높게</option><option value="1.4">아주 높게</option>
    </select></div>
  </div>
  <div class="f"><button id="s-test">목소리 미리듣기</button></div>
  <div class="f"><label>박수 두 번으로 호출</label><select id="s-clap"><option value="1">사용</option><option value="0">사용 안 함</option></select></div>
  <div class="f"><label>두뇌 서버 주소</label><input id="s-bridge" placeholder="http://localhost:8787">
    <div class="note">이 페이지는 어디서든 열리지만, 두뇌는 내 PC에서 JARVIS 실행 파일이 켜져 있어야 작동합니다.</div>
  </div>
  <div class="fin"><button id="s-close">닫기</button><button class="go" id="s-save">저장</button></div>
</div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ─────────── config ─────────── */
const DEF = { honorific:'보스', wake:'자비스', rate:1.05, pitch:1.0, voiceName:'', clap:true, bridge:'' };
let CFG = { ...DEF };
try { Object.assign(CFG, JSON.parse(localStorage.getItem('jarvis_cfg') || '{}')); } catch(e) {}
const saveCfg = () => localStorage.setItem('jarvis_cfg', JSON.stringify(CFG));
function bridgeURL() {
  if (CFG.bridge) return CFG.bridge.replace(/\/$/, '');
  if (location.protocol === 'http:' && location.port) return location.origin;
  return 'http://localhost:8787';
}

const S = { mode:'idle', bridge:false, micReady:false, wakeOn:false, busy:false, lastSpeakEnd:0 };

/* ─────────── caption / badge ─────────── */
let capTimer = null;
function cap(text, quiet) {
  const el = $('cap');
  el.textContent = text || '';
  el.classList.toggle('quiet', !!quiet);
  el.classList.toggle('on', !!text);
  clearTimeout(capTimer);
  if (text) capTimer = setTimeout(() => el.classList.remove('on'), quiet ? 2600 : 8000);
}
function badge() {
  const el = $('badge');
  el.className = S.bridge ? 'ok' : 'no';
  el.innerHTML = S.bridge ? '● <b>두뇌 연결됨</b>' : '○ <b>두뇌 없음</b> — 내 PC에서 JARVIS 실행';
}

/* ─────────── audio in ─────────── */
let actx=null, analyser=null, freq=null, micStream=null;
const BANDS = 64;
const band = new Float32Array(BANDS), bandS = new Float32Array(BANDS);
let level = 0, levelS = 0;

async function initAudio() {
  if (S.micReady) return true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
  } catch(e) { return false; }
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') await actx.resume();
  const src = actx.createMediaStreamSource(micStream);
  analyser = actx.createAnalyser();
  analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.75;
  src.connect(analyser);
  freq = new Uint8Array(analyser.frequencyBinCount);
  S.micReady = true; pollAudio(); return true;
}
function pollAudio() {
  if (!analyser) return;
  analyser.getByteFrequencyData(freq);
  const lo=2, hi=340; let sum=0;
  for (let i=0;i<BANDS;i++) {
    const t0=lo+Math.pow(i/BANDS,1.5)*(hi-lo), t1=lo+Math.pow((i+1)/BANDS,1.5)*(hi-lo);
    let m=0,n=0;
    for (let k=Math.floor(t0);k<=Math.min(Math.floor(t1),freq.length-1);k++){m+=freq[k];n++;}
    const v = n ? (m/n)/255 : 0;
    band[i]=v; sum+=v;
  }
  level = Math.min(1,(sum/BANDS)*2.6);
  requestAnimationFrame(pollAudio);
}

let td=null, clapT=[], lastTrans=0;
function clapWatch() {
  if (analyser && CFG.clap && !S.busy && S.mode!=='speak') {
    td = td || new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(td);
    let peak=0;
    for (let i=0;i<td.length;i+=2){ const v=Math.abs(td[i]-128)/128; if(v>peak)peak=v; }
    const now = performance.now();
    if (now-S.lastSpeakEnd>700 && peak>0.42 && now-lastTrans>150) {
      lastTrans=now; clapT.push(now);
      while (clapT.length && now-clapT[0]>900) clapT.shift();
      if (clapT.length>=2) {
        const gap = clapT[clapT.length-1]-clapT[clapT.length-2];
        if (gap>=150 && gap<=700) { clapT.length=0; wake(); }
      }
    }
  }
  setTimeout(clapWatch, 40);
}

/* ─────────── speech out ─────────── */
let voices = [];
function loadVoices() {
  voices = speechSynthesis.getVoices();
  const sel = $('s-voice'); if (!sel) return;
  sel.innerHTML = '<option value="">자동 선택</option>';
  const ko = voices.filter(v=>v.lang.startsWith('ko'));
  const rest = voices.filter(v=>!v.lang.startsWith('ko')).sort((a,b)=>a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name));
  const add = (label,list) => {
    if (!list.length) return;
    const g = document.createElement('optgroup'); g.label = label;
    list.forEach(v => {
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = v.name.replace(/^Microsoft |^Google /,'') + '  (' + v.lang + ')';
      if (v.name === CFG.voiceName) o.selected = true;
      g.appendChild(o);
    });
    sel.appendChild(g);
  };
  add('한국어', ko); add('기타 언어', rest);
}
speechSynthesis.onvoiceschanged = loadVoices;

let wordPulse = 0, speakQueue = [], speaking = false;
const pickVoice = () => voices.find(x=>x.name===CFG.voiceName)
  || voices.find(x=>x.lang==='ko-KR' && /google/i.test(x.name))
  || voices.find(x=>x.lang.startsWith('ko')) || voices[0];

function enqueueSpeak(t) {
  const s = (t||'').trim(); if (!s) return;
  speakQueue.push(s); if (!speaking) drainQueue();
}
function drainQueue() {
  if (!speakQueue.length) {
    speaking = false; S.lastSpeakEnd = performance.now();
    S.mode = S.wakeOn ? 'listen' : 'idle';
    setTimeout(resumeSTT, 260); return;
  }
  speaking = true; S.mode = 'speak'; pauseSTT();
  const u = new SpeechSynthesisUtterance(speakQueue.shift());
  const v = pickVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'ko-KR';
  u.rate = Number(CFG.rate)||1.05; u.pitch = Number(CFG.pitch)||1;
  u.onboundary = () => { wordPulse = 1; };
  u.onend = u.onerror = () => drainQueue();
  speechSynthesis.speak(u);
}
function stopSpeaking() {
  speakQueue = []; speaking = false; speechSynthesis.cancel();
  S.lastSpeakEnd = performance.now(); S.mode = S.wakeOn ? 'listen' : 'idle';
}
function speak(t, done) { stopSpeaking(); if (!t) { if (done) done(); return; } enqueueSpeak(t); }
function takeSentences(buf) {
  const out=[]; const re=/[^.!?。？！\n]*[.!?。？！\n]+/g; let m,last=0;
  while ((m=re.exec(buf))!==null){ const s=m[0].trim(); if(s.length>=2) out.push(s); last=re.lastIndex; }
  return { sentences: out, rest: buf.slice(last) };
}

/* ─────────── speech in ─────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recRun=false, recAlive=false, cmdTimer=null, capturing=false;
function initSTT() {
  if (!SR) { cap('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.'); return; }
  rec = new SR(); rec.lang='ko-KR'; rec.continuous=true; rec.interimResults=true;
  rec.onstart = () => { recAlive = true; };
  rec.onend = () => { recAlive=false; if (recRun && S.mode!=='speak') setTimeout(()=>{try{rec.start()}catch(e){}},180); };
  rec.onerror = e => {
    if (e.error==='not-allowed'||e.error==='service-not-allowed') {
      recRun=false; S.wakeOn=false; syncMicBtn();
      cap('마이크 권한이 필요합니다. 주소창 자물쇠에서 허용해주세요.');
    }
  };
  rec.onresult = ev => {
    let interim='', final='';
    for (let i=ev.resultIndex;i<ev.results.length;i++){
      const r=ev.results[i]; if(r.isFinal) final+=r[0].transcript; else interim+=r[0].transcript;
    }
    if (interim && capturing) cap(interim.trim());
    if (final) handleHeard(final.trim());
  };
}
function startSTT(){ if(rec){recRun=true; try{rec.start()}catch(e){}} }
function stopSTT(){ recRun=false; if(rec){try{rec.abort()}catch(e){}} }
function pauseSTT(){ if(rec&&recAlive){try{rec.abort()}catch(e){}} }
function resumeSTT(){ if(recRun&&rec&&!recAlive&&S.mode!=='speak'){try{rec.start()}catch(e){}} }

function matchWake(t) {
  const w = (CFG.wake||'자비스').replace(/\s/g,'');
  const vars = [w]; if (w==='자비스') vars.push('자비수','차비스','쟈비스','jarvis');
  for (const v of vars) {
    const re = new RegExp(v.split('').map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*'),'i');
    const m = t.match(re);
    if (m) return { hit:true, rest: t.slice(m.index+m[0].length).replace(/^[\s,.!?야씨~아]+/,'').trim() };
  }
  return { hit:false, rest:'' };
}
function handleHeard(text) {
  if (!text || S.mode==='speak') return;
  if (capturing) { clearTimeout(cmdTimer); capturing=false; return ask(text); }
  const m = matchWake(text);
  if (m.hit) { if (m.rest) ask(m.rest); else wake(); }
}
function wake() {
  if (S.busy || capturing || S.mode==='speak') return;
  if (!recRun) { S.wakeOn=true; startSTT(); syncMicBtn(); }
  capturing=true; S.mode='listen'; chime(); cap('듣고 있습니다', true);
  clearTimeout(cmdTimer);
  cmdTimer = setTimeout(()=>{ capturing=false; S.mode=S.wakeOn?'listen':'idle'; cap(''); }, 9000);
}

/* ─────────── bridge ─────────── */
async function checkBridge() {
  try {
    const c = new AbortController();
    const to = setTimeout(()=>c.abort(), 2500);
    const r = await fetch(bridgeURL()+'/health', { cache:'no-store', signal:c.signal });
    clearTimeout(to); S.bridge = r.ok;
  } catch(e) { S.bridge = false; }
  badge(); return S.bridge;
}
const TOOLNAME = { WebSearch:'웹 검색 중', WebFetch:'페이지 읽는 중', Read:'자료 읽는 중', Grep:'지식 검색 중',
  Glob:'파일 찾는 중', Bash:'실행 중', Write:'작성 중', Edit:'수정 중', TodoWrite:'정리 중' };

async function ask(text) {
  cap(text);
  if (!S.bridge && !(await checkBridge())) {
    S.mode='idle';
    return speak('두뇌가 연결되지 않았습니다. 내 컴퓨터에서 자비스 실행 파일을 켜주세요.');
  }
  S.busy=true; S.mode='think';
  let acc='', pend='';
  try {
    const res = await fetch(bridgeURL()+'/ask', {
      method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ text })
    });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf='';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while ((i = buf.indexOf('\n\n')) !== -1) {
        const chunk = buf.slice(0,i).trim(); buf = buf.slice(i+2);
        if (!chunk.startsWith('data:')) continue;
        let ev; try { ev = JSON.parse(chunk.slice(5)); } catch(e) { continue; }
        if (ev.kind==='tool') { if (!acc) cap(TOOLNAME[ev.name]||'작업 중', true); }
        else if (ev.kind==='delta') {
          acc += ev.text; pend += ev.text;
          const r = takeSentences(pend); pend = r.rest;
          if (r.sentences.length) { cap(acc.trim()); r.sentences.forEach(enqueueSpeak); }
        } else if (ev.kind==='done') {
          S.busy=false;
          if (!ev.ok) { stopSpeaking(); cap(ev.error); speak(ev.error); return; }
          const tail = pend.trim(); if (tail) enqueueSpeak(tail);
          const full = (acc || ev.text || '').trim();
          if (full) cap(full);
          if (!speaking && !speakQueue.length && full) speak(full);
          return;
        }
      }
    }
    S.busy=false;
    const tail = pend.trim(); if (tail) enqueueSpeak(tail);
    if (!speaking && !speakQueue.length) S.mode='idle';
  } catch(e) {
    S.busy=false; S.mode='idle';
    S.bridge=false; badge();
    speak('두뇌와의 연결이 끊어졌습니다.');
  }
}

function chime() {
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    [1046,1568].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*.08);
      g.gain.exponentialRampToValueAtTime(.07,t+i*.08+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.3);
      o.connect(g); g.connect(actx.destination);
      o.start(t+i*.08); o.stop(t+i*.08+.35);
    });
  } catch(e) {}
}

/* ══════════════════════════════════════════════════════════
   VISUAL — 유리질 동심원 포털 + 내부 홀로그램 도시 + 수면 반사
   ══════════════════════════════════════════════════════════ */
const cv = $('stage');
const ctx = cv.getContext('2d', { alpha:false });
const off = document.createElement('canvas');           // 포털을 따로 그려 반사에 재사용
const octx = off.getContext('2d');

let W=0,H=0,DPR=1,CX=0,CY=0,R=0,WATER=0;

/* 도시 스카이라인 — 건물마다 고정된 폭/기본높이/창문 시드 */
const NB = 46;
const BLD = [];
for (let i=0;i<NB;i++) {
  BLD.push({
    base: 0.22 + Math.pow(Math.abs(Math.sin(i*2.7)),1.4)*0.55 + (i%7===0?0.18:0),
    w: 0.55 + (i%3)*0.22,
    seed: Math.random(),
    win: Math.floor(3 + Math.random()*5)
  });
}
/* 배경 보케 */
const BOKEH = [];
for (let i=0;i<46;i++) BOKEH.push({ x:Math.random(), y:Math.random(), r:0.01+Math.random()*0.055, a:0.02+Math.random()*0.09, s:Math.random() });
/* 광선 */
const STREAK = [];
for (let i=0;i<7;i++) STREAK.push({ a:Math.random()*6.283, sp:0.05+Math.random()*0.14, len:0.5+Math.random()*0.9, w:Math.random(), off:Math.random()*6.283 });

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const vw = Math.max(320, innerWidth||0), vh = Math.max(240, innerHeight||0);
  W = cv.width = off.width = Math.floor(vw*DPR);
  H = cv.height = off.height = Math.floor(vh*DPR);
  cv.style.width = vw+'px'; cv.style.height = vh+'px';
  CX = W/2; CY = H*0.435; R = Math.min(W,H)*0.285; WATER = H*0.735;
}
addEventListener('resize', resize);
resize();

let energy=0, spin=0, hue=0, rot=0;

function bandAt(u) {                       // u: 0..1
  const f = Math.min(BANDS-1, Math.max(0, u*(BANDS-1)));
  const i = Math.floor(f), fr = f-i;
  return (bandS[i]||0)*(1-fr) + (bandS[Math.min(i+1,BANDS-1)]||0)*fr;
}

/* ── 배경: 깊은 남색 그라디언트 + 보케 + 수면 ── */
function drawBackground(t) {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,   '#01060f');
  g.addColorStop(0.42,'#04182f');
  g.addColorStop(0.72,'#062340');
  g.addColorStop(1,   '#010912');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // 보케 (초점 밖 도시 불빛)
  ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    const bx = b.x*W, by = b.y*H*0.85;
    const br = b.r*Math.min(W,H)*(1+0.12*Math.sin(t*0.3+b.s*9));
    const a = b.a*(0.5+0.5*Math.sin(t*0.22+b.s*11))*(0.55+energy*0.6);
    const rg = ctx.createRadialGradient(bx,by,0,bx,by,br);
    rg.addColorStop(0,'rgba(90,180,255,'+a+')');
    rg.addColorStop(0.55,'rgba(40,110,200,'+(a*0.35)+')');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(bx,by,br,0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ── 홀로그램 도시 (포털 내부) ── */
function drawCity(c, t) {
  c.save();
  c.beginPath(); c.arc(CX,CY,R*0.965,0,6.2832); c.clip();

  const ground = CY + R*0.62;
  const span = R*1.95;
  const bw = span/NB;

  // 원근 격자 바닥
  c.strokeStyle = 'rgba(70,160,235,0.16)'; c.lineWidth = DPR;
  for (let i=0;i<=12;i++) {
    const x = CX - span/2 + (span/12)*i;
    c.beginPath(); c.moveTo(x, ground); c.lineTo(CX + (x-CX)*2.1, ground + R*0.42); c.stroke();
  }
  for (let i=1;i<=5;i++) {
    const y = ground + Math.pow(i/5,1.9)*R*0.42;
    c.strokeStyle = 'rgba(70,160,235,'+(0.16-i*0.022)+')';
    c.beginPath(); c.moveTo(CX-span*0.9, y); c.lineTo(CX+span*0.9, y); c.stroke();
  }

  // 건물 — 높이가 음파에 반응한다
  for (let i=0;i<NB;i++) {
    const b = BLD[i];
    const u = i/(NB-1);
    const aud = bandAt(u < 0.5 ? u*2 : (1-u)*2);
    const h = R*(b.base*0.62 + aud*(0.30+energy*0.55) + energy*0.06);
    const x = CX - span/2 + bw*i + bw*0.12;
    const w = bw*b.w*0.9;
    const top = ground - h;

    const gg = c.createLinearGradient(0, top, 0, ground);
    const lit = 0.30 + aud*0.55 + energy*0.25;
    gg.addColorStop(0,   'rgba(180,235,255,'+Math.min(0.92,lit)+')');
    gg.addColorStop(0.25,'rgba(70,175,250,'+(lit*0.55)+')');
    gg.addColorStop(1,   'rgba(20,80,150,0.05)');
    c.fillStyle = gg;
    c.fillRect(x, top, w, h);

    // 상단 하이라이트
    c.fillStyle = 'rgba(215,245,255,'+Math.min(0.95, 0.35+aud*0.6)+')';
    c.fillRect(x, top, w, Math.max(DPR, DPR*1.4));

    // 창문
    c.fillStyle = 'rgba(150,220,255,'+(0.12+aud*0.3)+')';
    const rows = b.win;
    for (let r0=0;r0<rows;r0++) {
      const wy = top + h*(0.12 + r0*(0.8/rows));
      if (((r0*7 + i*3 + Math.floor(t*1.4+b.seed*10)) % 5) === 0) continue;
      c.fillRect(x+w*0.18, wy, w*0.64, Math.max(1, DPR*0.9));
    }
  }

  // 도시 위 은은한 광휘
  const glow = c.createRadialGradient(CX, ground-R*0.25, 0, CX, ground-R*0.25, R*1.1);
  glow.addColorStop(0,'rgba(70,180,255,'+(0.10+energy*0.14)+')');
  glow.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = glow; c.fillRect(CX-R, CY-R, R*2, R*2);

  c.restore();
}

/* ── 유리질 동심원 링 ── */
function glassBand(c, r, width, alpha, gapStart, gapLen) {
  const steps = 16;
  for (let i=0;i<steps;i++) {
    const p = i/(steps-1);
    const rr = r - width/2 + width*p;
    // 가장자리가 밝고 가운데가 어두운 유리 단면
    const edge = Math.pow(Math.abs(p-0.5)*2, 2.1);
    const a = alpha*(0.10 + edge*0.95);
    c.strokeStyle = 'rgba(175,230,255,'+a+')';
    c.lineWidth = Math.max(1, (width/steps)*1.35);
    c.beginPath();
    if (gapLen) c.arc(CX,CY,rr, gapStart+gapLen, gapStart+6.2832);
    else c.arc(CX,CY,rr,0,6.2832);
    c.stroke();
  }
}

function drawPortal(c, t) {
  const e = energy;
  c.save();
  c.globalCompositeOperation = 'lighter';

  // 뒤쪽 광휘
  const bg = c.createRadialGradient(CX,CY,R*0.1,CX,CY,R*1.55);
  bg.addColorStop(0,'rgba(40,130,220,'+(0.10+e*0.13)+')');
  bg.addColorStop(0.6,'rgba(20,80,160,'+(0.05+e*0.06)+')');
  bg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle = bg; c.beginPath(); c.arc(CX,CY,R*1.55,0,6.2832); c.fill();

  drawCity(c, t);

  // 주 림 (포털 테두리) — 가장 밝다
  c.strokeStyle = 'rgba(215,245,255,'+(0.55+e*0.4)+')';
  c.lineWidth = 2.4*DPR;
  c.beginPath(); c.arc(CX,CY,R,0,6.2832); c.stroke();
  c.strokeStyle = 'rgba(120,205,255,'+(0.22+e*0.25)+')';
  c.lineWidth = 7*DPR;
  c.beginPath(); c.arc(CX,CY,R,0,6.2832); c.stroke();

  // 유리 밴드들
  glassBand(c, R*1.115, R*0.085, 0.30+e*0.22);
  glassBand(c, R*1.235, R*0.045, 0.22+e*0.18, rot*0.6, 1.05);
  glassBand(c, R*0.885, R*0.055, 0.26+e*0.20, -rot*0.9, 0.8);

  // 회전하는 얇은 아크 (기계식 디테일)
  c.lineCap = 'round';
  for (let k=0;k<5;k++) {
    const rr = R*(1.30 + k*0.055);
    const a0 = rot*(0.5 + k*0.22)*(k%2?-1:1) + k*1.4;
    const len = 0.5 + 0.55*Math.sin(t*0.4+k);
    c.strokeStyle = 'rgba(150,220,255,'+(0.13+e*0.20)*(1-k*0.13)+')';
    c.lineWidth = (k%2 ? 1.4 : 2.6)*DPR;
    c.beginPath(); c.arc(CX,CY,rr,a0,a0+len); c.stroke();
  }
  c.lineCap = 'butt';

  // 외곽 눈금
  c.strokeStyle = 'rgba(140,215,255,'+(0.16+e*0.2)+')';
  c.lineWidth = DPR;
  const rTick = R*1.42;
  for (let i=0;i<96;i++) {
    const a = (i/96)*6.2832 + rot*0.12;
    const long = i%8===0;
    const l = (long?11:5)*DPR;
    const c0=Math.cos(a), s0=Math.sin(a);
    c.beginPath(); c.moveTo(CX+c0*rTick, CY+s0*rTick); c.lineTo(CX+c0*(rTick+l), CY+s0*(rTick+l)); c.stroke();
  }

  // 타겟팅 브래킷
  c.strokeStyle = 'rgba(200,240,255,'+(0.30+e*0.35)+')';
  c.lineWidth = 2*DPR;
  const rB = R*(1.52+e*0.05);
  for (let k=0;k<4;k++) {
    const a = k*1.5708 + 0.7854 + rot*0.05;
    c.beginPath(); c.arc(CX,CY,rB,a-0.13,a+0.13); c.stroke();
    [-0.13,0.13].forEach(d=>{
      const c0=Math.cos(a+d), s0=Math.sin(a+d);
      c.beginPath(); c.moveTo(CX+c0*rB, CY+s0*rB); c.lineTo(CX+c0*(rB-10*DPR), CY+s0*(rB-10*DPR)); c.stroke();
    });
  }

  // 광선
  for (const st of STREAK) {
    const a = st.off + t*st.sp;
    const r0 = R*0.2, r1 = R*(1.05+st.len*0.55);
    const c0=Math.cos(a), s0=Math.sin(a);
    const gx = c.createLinearGradient(CX+c0*r0, CY+s0*r0, CX+c0*r1, CY+s0*r1);
    const aa = (0.05+e*0.13)*(0.35+0.65*Math.abs(Math.sin(t*0.5+st.off)));
    gx.addColorStop(0,'rgba(160,225,255,0)');
    gx.addColorStop(0.5,'rgba(190,235,255,'+aa+')');
    gx.addColorStop(1,'rgba(160,225,255,0)');
    c.strokeStyle = gx; c.lineWidth = (0.7+st.w*1.6)*DPR;
    c.beginPath(); c.moveTo(CX+c0*r0, CY+s0*r0); c.lineTo(CX+c0*r1, CY+s0*r1); c.stroke();
  }

  c.restore();
}

function frame(ts) {
  const t = ts/1000;
  const wantW = Math.floor(Math.max(320, innerWidth||0)*DPR);
  if (wantW !== W) resize();

  for (let i=0;i<BANDS;i++) {
    const tg = band[i]||0;
    bandS[i] += (tg-bandS[i]) * (tg>bandS[i] ? 0.45 : 0.10);
  }
  levelS += (level-levelS)*(level>levelS?0.35:0.07);
  wordPulse *= 0.90;

  let tE, tS;
  if (S.mode==='speak')       { tE = 0.62 + levelS*0.85 + wordPulse*0.35; tS = 0.34; }
  else if (S.mode==='think')  { tE = 0.46 + 0.16*Math.sin(t*3.0);          tS = 0.85; }
  else if (S.mode==='listen') { tE = 0.30 + levelS*0.75;                   tS = 0.18; }
  else                        { tE = 0.16 + levelS*0.28;                   tS = 0.08; }
  energy += (Math.min(1.15,tE)-energy)*0.10;
  spin += (tS-spin)*0.05;
  rot += 0.0016 + spin*0.009;

  drawBackground(t);

  // 포털을 오프스크린에 그린 뒤, 본체 + 수면 반사로 두 번 사용
  octx.clearRect(0,0,W,H);
  drawPortal(octx, t);

  ctx.drawImage(off, 0, 0);

  // 수면 반사
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.30 + energy*0.12;
  ctx.translate(0, WATER*2);
  ctx.scale(1,-1);
  ctx.drawImage(off, 0, 0);
  ctx.restore();

  // 수면 위 잔물결 — 반사를 잘라 물처럼 보이게
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  for (let y=WATER; y<H; y+=Math.max(2, 3*DPR)) {
    const d = (y-WATER)/(H-WATER);
    const a = 0.16 + d*0.55 + 0.09*Math.sin(y*0.09 + performance.now()/700);
    ctx.fillStyle = 'rgba(1,8,18,'+Math.min(0.95,a)+')';
    ctx.fillRect(0, y, W, Math.max(1, DPR));
  }
  // 수평선
  const hl = ctx.createLinearGradient(0,WATER-2*DPR,0,WATER+2*DPR);
  hl.addColorStop(0,'rgba(120,205,255,0)');
  hl.addColorStop(0.5,'rgba(150,220,255,'+(0.12+energy*0.16)+')');
  hl.addColorStop(1,'rgba(120,205,255,0)');
  ctx.fillStyle = hl; ctx.fillRect(0, WATER-2*DPR, W, 4*DPR);
  ctx.restore();

  // 비네트
  const vg = ctx.createRadialGradient(CX,CY,R*0.9,CX,CY,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,2,8,0.72)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ─────────── interactions ─────────── */
let uiTimer=null;
function showUI(){ document.body.classList.add('showui'); clearTimeout(uiTimer); uiTimer=setTimeout(()=>document.body.classList.remove('showui'),2600); }
addEventListener('mousemove', showUI);

cv.addEventListener('click', () => {
  if ($('sheet').classList.contains('on')) return;
  if (S.mode==='speak') { stopSpeaking(); return; }
  wake();
});
function syncMicBtn(){ $('b-mic').classList.toggle('off', !S.wakeOn); }
$('b-mic').onclick = e => { e.stopPropagation(); S.wakeOn=!S.wakeOn;
  if (S.wakeOn){ startSTT(); cap('웨이크워드 대기 중',true);} else { stopSTT(); cap('대기 해제',true);} syncMicBtn(); };
$('b-new').onclick = async e => { e.stopPropagation();
  try { await fetch(bridgeURL()+'/reset',{method:'POST'}); cap('새 대화를 시작합니다',true); }
  catch(err){ cap('두뇌가 연결되지 않았습니다',true); } };
$('b-set').onclick = e => { e.stopPropagation(); openSheet(); };

function openSheet() {
  $('s-hon').value=CFG.honorific; $('s-wake').value=CFG.wake;
  $('s-rate').value=String(CFG.rate); $('s-pitch').value=String(CFG.pitch);
  $('s-clap').value=CFG.clap?'1':'0'; $('s-bridge').value=CFG.bridge||'';
  loadVoices(); $('sheet').classList.add('on');
}
$('s-test').onclick = () => {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('안녕하십니까. 자비스입니다. 무엇을 도와드릴까요.');
  const v = voices.find(x=>x.name===$('s-voice').value);
  if (v) { u.voice=v; u.lang=v.lang; } else u.lang='ko-KR';
  u.rate=parseFloat($('s-rate').value); u.pitch=parseFloat($('s-pitch').value);
  speechSynthesis.speak(u);
};
$('s-close').onclick = () => $('sheet').classList.remove('on');
$('sheet').onclick = e => { if (e.target===$('sheet')) $('sheet').classList.remove('on'); };
$('s-save').onclick = async () => {
  CFG.honorific = $('s-hon').value.trim()||'보스';
  CFG.wake = $('s-wake').value.trim()||'자비스';
  CFG.rate = parseFloat($('s-rate').value);
  CFG.pitch = parseFloat($('s-pitch').value);
  CFG.voiceName = $('s-voice').value;
  CFG.clap = $('s-clap').value==='1';
  CFG.bridge = $('s-bridge').value.trim();
  saveCfg(); $('sheet').classList.remove('on');
  cap('설정을 저장했습니다', true);
  await checkBridge();
};

/* ─────────── boot ─────────── */
(async function boot() {
  loadVoices(); initSTT(); syncMicBtn(); showUI(); badge();
  const ok = await checkBridge();
  await initAudio(); clapWatch();
  const h = new Date().getHours();
  const greet = h<5?'늦은 밤까지 고생 많으십니다':h<12?'좋은 아침입니다':h<18?'좋은 오후입니다':'좋은 저녁입니다';
  if (ok) {
    S.wakeOn=true; startSTT(); syncMicBtn();
    cap(greet+', '+CFG.honorific, true);
    speak(greet+', '+CFG.honorific+'. 자비스 대기 중입니다.');
  } else {
    cap('내 컴퓨터에서 JARVIS 실행 파일을 켜면 두뇌가 연결됩니다.');
  }
  setInterval(() => { if (!S.busy) checkBridge(); }, 15000);
})();
</script>
