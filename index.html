<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<style>
  :root { --ink: #4fe6d2; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000504; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; color: var(--ink); cursor: none; }
  body.showui { cursor: default; }

  #stage { position: fixed; inset: 0; display: block; }

  #cap {
    position: fixed; left: 50%; bottom: 6.5vh; transform: translateX(-50%);
    max-width: min(780px, 84vw); text-align: center;
    font-size: clamp(13px, 1.5vw, 17px); font-weight: 300; line-height: 1.6;
    color: #a8f5e8; opacity: 0; transition: opacity .7s ease;
    text-shadow: 0 0 26px rgba(60,225,200,.6), 0 2px 12px rgba(0,0,0,.9);
    pointer-events: none; white-space: pre-wrap;
  }
  #cap.on { opacity: .95; }
  #cap.quiet { color: #46a99b; font-size: clamp(11px,1.1vw,13px); letter-spacing: .2em; text-transform: uppercase; }

  #ctl { position: fixed; top: 18px; right: 20px; display: flex; gap: 10px; opacity: 0; transition: opacity .35s; pointer-events: none; }
  body.showui #ctl { opacity: 1; pointer-events: auto; }
  .cbtn {
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    background: rgba(8,40,38,.55); border: 1px solid rgba(90,230,210,.3);
    color: #4fe6d2; font-size: 14px; display: grid; place-items: center;
    backdrop-filter: blur(6px); transition: all .2s;
  }
  .cbtn:hover { background: rgba(16,80,74,.85); border-color: rgba(90,230,210,.65); }
  .cbtn.off { color: #256b63; border-color: rgba(90,230,210,.13); }

  #badge { position: fixed; left: 20px; top: 18px; font-size: 10px; letter-spacing: .22em; opacity: 0; transition: opacity .35s; pointer-events: none; text-transform: uppercase; }
  body.showui #badge { opacity: .85; }
  #badge b { font-weight: 500; }
  #badge.ok { color: #46a99b; }
  #badge.no { color: #d98a5a; }

  #sheet { position: fixed; inset: 0; background: rgba(0,6,6,.88); backdrop-filter: blur(10px); display: none; place-items: center; z-index: 20; }
  #sheet.on { display: grid; }
  #card { width: min(430px,88vw); max-height: 90vh; overflow-y: auto; padding: 28px 30px; background: rgba(5,26,25,.93); border: 1px solid rgba(90,230,210,.24); border-radius: 14px; }
  #card h2 { font-size: 11px; letter-spacing: .4em; font-weight: 400; color: #4fe6d2; margin-bottom: 20px; }
  .f { margin-bottom: 14px; }
  .f label { display: block; font-size: 10.5px; letter-spacing: .14em; color: #46a99b; margin-bottom: 6px; }
  .f input, .f select { width: 100%; background: rgba(0,12,12,.7); border: 1px solid rgba(90,230,210,.2); color: #d5fff8; padding: 9px 11px; border-radius: 7px; font-size: 13px; outline: none; font-family: inherit; }
  .f input:focus, .f select:focus { border-color: rgba(90,230,210,.55); }
  .row { display: flex; gap: 11px; } .row .f { flex: 1; }
  .fin { display: flex; gap: 9px; justify-content: flex-end; margin-top: 20px; }
  .fin button, #s-test { padding: 9px 18px; border-radius: 7px; font-size: 12.5px; cursor: pointer; font-family: inherit; background: none; border: 1px solid rgba(90,230,210,.28); color: #46a99b; }
  .fin button.go { background: rgba(90,230,210,.15); color: #4fe6d2; border-color: rgba(90,230,210,.5); }
  #s-test { width: 100%; background: rgba(90,230,210,.08); color: #4fe6d2; }
  .note { font-size: 10.5px; color: #35827a; line-height: 1.7; margin-top: 5px; }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div id="badge"></div>
<div id="cap"></div>

<div id="ctl">
  <button class="cbtn" id="b-mic" title="음성 대기">🎙</button>
  <button class="cbtn" id="b-new" title="새 대화">↺</button>
  <button class="cbtn" id="b-set" title="설정">⚙</button>
</div>

<div id="sheet"><div id="card">
  <h2>SETTINGS</h2>
  <div class="row">
    <div class="f"><label>호칭</label><input id="s-hon" placeholder="보스"></div>
    <div class="f"><label>웨이크워드</label><input id="s-wake" placeholder="자비스"></div>
  </div>
  <div class="f"><label>목소리</label><select id="s-voice"><option value="">자동 선택</option></select></div>
  <div class="row">
    <div class="f"><label>속도</label><select id="s-rate">
      <option value="0.8">아주 느리게</option><option value="0.9">느리게</option>
      <option value="1.05">보통</option><option value="1.2">빠르게</option><option value="1.4">아주 빠르게</option>
    </select></div>
    <div class="f"><label>음높이</label><select id="s-pitch">
      <option value="0.7">아주 낮게</option><option value="0.85">낮게</option>
      <option value="1">보통</option><option value="1.2">높게</option><option value="1.4">아주 높게</option>
    </select></div>
  </div>
  <div class="f"><button id="s-test">목소리 미리듣기</button></div>
  <div class="f"><label>박수 두 번으로 호출</label><select id="s-clap"><option value="1">사용</option><option value="0">사용 안 함</option></select></div>
  <div class="f"><label>두뇌 서버 주소 (비워두면 자동)</label><input id="s-bridge" placeholder="자동 탐색">
    <div class="note">비워두면 내 PC의 자비스가 게시한 공개 주소를 자동으로 찾습니다. 특정 주소를 강제하고 싶을 때만 입력하세요.</div>
  </div>
  <div class="fin"><button id="s-close">닫기</button><button class="go" id="s-save">저장</button></div>
</div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ─────────── config ─────────── */
const DEF = { honorific:'보스', wake:'자비스', rate:1.05, pitch:1.0, voiceName:'', clap:true, bridge:'' };
let CFG = { ...DEF };
try { Object.assign(CFG, JSON.parse(localStorage.getItem('jarvis_cfg') || '{}')); } catch(e) {}
const saveCfg = () => localStorage.setItem('jarvis_cfg', JSON.stringify(CFG));

/* 두뇌 주소 자동 탐색 —
   내 PC의 자비스가 켜지면 공개 주소를 깃허브에 올린다.
   페이지는 그 주소를 읽어와 스스로 연결하므로, 어느 기기에서든 설정이 필요 없다. */
const BRIDGE_INDEX = 'https://raw.githubusercontent.com/SBJarvis0315/jarvis/main/bridge.json';
let RESOLVED = null;
function bridgeURL() { return RESOLVED || 'http://localhost:8787'; }

async function alive(base) {
  try {
    const c = new AbortController();
    const to = setTimeout(() => c.abort(), 4000);
    const r = await fetch(base + '/health', { cache: 'no-store', signal: c.signal });
    clearTimeout(to);
    return r.ok;
  } catch (e) { return false; }
}

async function discoverBridge() {
  const tries = [];
  if (CFG.bridge) tries.push(CFG.bridge.replace(/\/$/, ''));                  // 직접 지정이 최우선
  if (location.protocol === 'http:' && location.port) tries.push(location.origin);
  // 깃허브에 게시된 공개 주소
  try {
    const r = await fetch(BRIDGE_INDEX + '?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (j && j.url) tries.push(String(j.url).replace(/\/$/, ''));
    }
  } catch (e) {}
  tries.push('http://localhost:8787');                                        // 같은 PC일 때

  for (const base of tries) {
    if (await alive(base)) { RESOLVED = base; return base; }
  }
  RESOLVED = null;
  return null;
}

const S = { mode:'idle', bridge:false, micReady:false, wakeOn:false, busy:false, lastSpeakEnd:0 };

/* ─────────── caption / badge ─────────── */
let capTimer = null;
function cap(text, quiet) {
  const el = $('cap');
  el.textContent = text || '';
  el.classList.toggle('quiet', !!quiet);
  el.classList.toggle('on', !!text);
  clearTimeout(capTimer);
  if (text) capTimer = setTimeout(() => el.classList.remove('on'), quiet ? 2600 : 8000);
}
function badge() {
  const el = $('badge');
  el.className = S.bridge ? 'ok' : 'no';
  el.innerHTML = S.bridge
    ? '● <b>두뇌 연결됨</b>'
    : '○ <b>두뇌 대기 중</b> — 내 PC에서 JARVIS 실행 필요';
}

/* ─────────── audio in ─────────── */
let actx=null, analyser=null, freq=null, micStream=null;
const BANDS = 64;
const band = new Float32Array(BANDS), bandS = new Float32Array(BANDS);
let level = 0, levelS = 0;

async function initAudio() {
  if (S.micReady) return true;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
  } catch(e) { return false; }
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') await actx.resume();
  const src = actx.createMediaStreamSource(micStream);
  analyser = actx.createAnalyser();
  analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.75;
  src.connect(analyser);
  freq = new Uint8Array(analyser.frequencyBinCount);
  S.micReady = true; pollAudio(); return true;
}
function pollAudio() {
  if (!analyser) return;
  analyser.getByteFrequencyData(freq);
  const lo=2, hi=340; let sum=0;
  for (let i=0;i<BANDS;i++) {
    const t0=lo+Math.pow(i/BANDS,1.5)*(hi-lo), t1=lo+Math.pow((i+1)/BANDS,1.5)*(hi-lo);
    let m=0,n=0;
    for (let k=Math.floor(t0);k<=Math.min(Math.floor(t1),freq.length-1);k++){m+=freq[k];n++;}
    const v = n ? (m/n)/255 : 0;
    band[i]=v; sum+=v;
  }
  level = Math.min(1,(sum/BANDS)*2.6);
  requestAnimationFrame(pollAudio);
}

let td=null, clapT=[], lastTrans=0;
function clapWatch() {
  if (analyser && CFG.clap && !S.busy && S.mode!=='speak') {
    td = td || new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(td);
    let peak=0;
    for (let i=0;i<td.length;i+=2){ const v=Math.abs(td[i]-128)/128; if(v>peak)peak=v; }
    const now = performance.now();
    if (now-S.lastSpeakEnd>700 && peak>0.42 && now-lastTrans>150) {
      lastTrans=now; clapT.push(now);
      while (clapT.length && now-clapT[0]>900) clapT.shift();
      if (clapT.length>=2) {
        const gap = clapT[clapT.length-1]-clapT[clapT.length-2];
        if (gap>=150 && gap<=700) { clapT.length=0; wake(); }
      }
    }
  }
  setTimeout(clapWatch, 40);
}

/* ─────────── speech out ─────────── */
let voices = [];
function loadVoices() {
  voices = speechSynthesis.getVoices();
  const sel = $('s-voice'); if (!sel) return;
  sel.innerHTML = '<option value="">자동 선택</option>';
  const ko = voices.filter(v=>v.lang.startsWith('ko'));
  const rest = voices.filter(v=>!v.lang.startsWith('ko')).sort((a,b)=>a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name));
  const add = (label,list) => {
    if (!list.length) return;
    const g = document.createElement('optgroup'); g.label = label;
    list.forEach(v => {
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = v.name.replace(/^Microsoft |^Google /,'') + '  (' + v.lang + ')';
      if (v.name === CFG.voiceName) o.selected = true;
      g.appendChild(o);
    });
    sel.appendChild(g);
  };
  add('한국어', ko); add('기타 언어', rest);
}
speechSynthesis.onvoiceschanged = loadVoices;

let wordPulse = 0, speakQueue = [], speaking = false;
const pickVoice = () => voices.find(x=>x.name===CFG.voiceName)
  || voices.find(x=>x.lang==='ko-KR' && /google/i.test(x.name))
  || voices.find(x=>x.lang.startsWith('ko')) || voices[0];

function enqueueSpeak(t) {
  const s = (t||'').trim(); if (!s) return;
  speakQueue.push(s); if (!speaking) drainQueue();
}
function drainQueue() {
  if (!speakQueue.length) {
    speaking = false; S.lastSpeakEnd = performance.now();
    S.mode = S.wakeOn ? 'listen' : 'idle';
    setTimeout(resumeSTT, 260); return;
  }
  speaking = true; S.mode = 'speak'; pauseSTT();
  const u = new SpeechSynthesisUtterance(speakQueue.shift());
  const v = pickVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'ko-KR';
  u.rate = Number(CFG.rate)||1.05; u.pitch = Number(CFG.pitch)||1;
  u.onboundary = () => { wordPulse = 1; };
  u.onend = u.onerror = () => drainQueue();
  speechSynthesis.speak(u);
}
function stopSpeaking() {
  speakQueue = []; speaking = false; speechSynthesis.cancel();
  S.lastSpeakEnd = performance.now(); S.mode = S.wakeOn ? 'listen' : 'idle';
}
function speak(t, done) { stopSpeaking(); if (!t) { if (done) done(); return; } enqueueSpeak(t); }
function takeSentences(buf) {
  const out=[]; const re=/[^.!?。？！\n]*[.!?。？！\n]+/g; let m,last=0;
  while ((m=re.exec(buf))!==null){ const s=m[0].trim(); if(s.length>=2) out.push(s); last=re.lastIndex; }
  return { sentences: out, rest: buf.slice(last) };
}

/* ─────────── speech in ─────────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recRun=false, recAlive=false, cmdTimer=null, capturing=false;
function initSTT() {
  if (!SR) { cap('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.'); return; }
  rec = new SR(); rec.lang='ko-KR'; rec.continuous=true; rec.interimResults=true;
  rec.onstart = () => { recAlive = true; };
  rec.onend = () => { recAlive=false; if (recRun && S.mode!=='speak') setTimeout(()=>{try{rec.start()}catch(e){}},180); };
  rec.onerror = e => {
    if (e.error==='not-allowed'||e.error==='service-not-allowed') {
      recRun=false; S.wakeOn=false; syncMicBtn();
      cap('마이크 권한이 필요합니다. 주소창 자물쇠에서 허용해주세요.');
    }
  };
  rec.onresult = ev => {
    let interim='', final='';
    for (let i=ev.resultIndex;i<ev.results.length;i++){
      const r=ev.results[i]; if(r.isFinal) final+=r[0].transcript; else interim+=r[0].transcript;
    }
    if (interim && capturing) cap(interim.trim());
    if (final) handleHeard(final.trim());
  };
}
function startSTT(){ if(rec){recRun=true; try{rec.start()}catch(e){}} }
function stopSTT(){ recRun=false; if(rec){try{rec.abort()}catch(e){}} }
function pauseSTT(){ if(rec&&recAlive){try{rec.abort()}catch(e){}} }
function resumeSTT(){ if(recRun&&rec&&!recAlive&&S.mode!=='speak'){try{rec.start()}catch(e){}} }

function matchWake(t) {
  const w = (CFG.wake||'자비스').replace(/\s/g,'');
  const vars = [w]; if (w==='자비스') vars.push('자비수','차비스','쟈비스','jarvis');
  for (const v of vars) {
    const re = new RegExp(v.split('').map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*'),'i');
    const m = t.match(re);
    if (m) return { hit:true, rest: t.slice(m.index+m[0].length).replace(/^[\s,.!?야씨~아]+/,'').trim() };
  }
  return { hit:false, rest:'' };
}
function handleHeard(text) {
  if (!text || S.mode==='speak') return;
  if (capturing) { clearTimeout(cmdTimer); capturing=false; return ask(text); }
  const m = matchWake(text);
  if (m.hit) { if (m.rest) ask(m.rest); else wake(); }
}
function wake() {
  if (S.busy || capturing || S.mode==='speak') return;
  if (!recRun) { S.wakeOn=true; startSTT(); syncMicBtn(); }
  capturing=true; S.mode='listen'; chime(); cap('듣고 있습니다', true);
  clearTimeout(cmdTimer);
  cmdTimer = setTimeout(()=>{ capturing=false; S.mode=S.wakeOn?'listen':'idle'; cap(''); }, 9000);
}

/* ─────────── bridge ─────────── */
async function checkBridge() {
  // 이미 찾은 주소가 살아있으면 그대로 쓰고, 아니면 다시 탐색한다
  if (RESOLVED && await alive(RESOLVED)) { S.bridge = true; badge(); return true; }
  const found = await discoverBridge();
  S.bridge = !!found;
  badge();
  return S.bridge;
}
const TOOLNAME = { WebSearch:'웹 검색 중', WebFetch:'페이지 읽는 중', Read:'자료 읽는 중', Grep:'지식 검색 중',
  Glob:'파일 찾는 중', Bash:'실행 중', Write:'작성 중', Edit:'수정 중', TodoWrite:'정리 중' };

async function ask(text) {
  cap(text);
  if (!S.bridge && !(await checkBridge())) {
    S.mode='idle';
    return speak('두뇌가 연결되지 않았습니다. 내 컴퓨터에서 자비스 실행 파일을 켜주세요.');
  }
  S.busy=true; S.mode='think';
  let acc='', pend='';
  try {
    const res = await fetch(bridgeURL()+'/ask', {
      method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ text })
    });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf='';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while ((i = buf.indexOf('\n\n')) !== -1) {
        const chunk = buf.slice(0,i).trim(); buf = buf.slice(i+2);
        if (!chunk.startsWith('data:')) continue;
        let ev; try { ev = JSON.parse(chunk.slice(5)); } catch(e) { continue; }
        if (ev.kind==='tool') { if (!acc) cap(TOOLNAME[ev.name]||'작업 중', true); }
        else if (ev.kind==='delta') {
          acc += ev.text; pend += ev.text;
          const r = takeSentences(pend); pend = r.rest;
          if (r.sentences.length) { cap(acc.trim()); r.sentences.forEach(enqueueSpeak); }
        } else if (ev.kind==='done') {
          S.busy=false;
          if (!ev.ok) { stopSpeaking(); cap(ev.error); speak(ev.error); return; }
          const tail = pend.trim(); if (tail) enqueueSpeak(tail);
          const full = (acc || ev.text || '').trim();
          if (full) cap(full);
          if (!speaking && !speakQueue.length && full) speak(full);
          return;
        }
      }
    }
    S.busy=false;
    const tail = pend.trim(); if (tail) enqueueSpeak(tail);
    if (!speaking && !speakQueue.length) S.mode='idle';
  } catch(e) {
    S.busy=false; S.mode='idle'; S.bridge=false; badge();
    speak('두뇌와의 연결이 끊어졌습니다.');
  }
}

function chime() {
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    [1046,1568].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*.08);
      g.gain.exponentialRampToValueAtTime(.07,t+i*.08+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.3);
      o.connect(g); g.connect(actx.destination);
      o.start(t+i*.08); o.stop(t+i*.08+.35);
    });
  } catch(e) {}
}

/* ══════════════════════════════════════════════════════════
   VISUAL — 3D 반투명 껍질(메시) + 내부 코어 디스크
   실제 3D 정점을 매 프레임 계산해 원근 투영한다.
   앞면/뒷면을 깊이에 따라 다른 밝기로 그려서 속이 비쳐 보인다.
   ══════════════════════════════════════════════════════════ */
const cv = $('stage');
const ctx = cv.getContext('2d', { alpha:false });
let W=0,H=0,DPR=1,CX=0,CY=0,R=0;

const NU = 76;          // 경도 분할 (가로)
const NV = 40;          // 위도 분할 (세로)
const VX = new Float32Array(NU*NV);
const VY = new Float32Array(NU*NV);
const VZ = new Float32Array(NU*NV);
const SXa = new Float32Array(NU*NV);   // 화면 좌표
const SYa = new Float32Array(NU*NV);
const SD = new Float32Array(NU*NV);    // 깊이 0..1 (1=앞)

/* 코어 반짝임 */
const SPECK = [];
for (let i=0;i<150;i++) {
  const a = Math.random()*6.2832, rr = Math.pow(Math.random(),0.7);
  SPECK.push({ a, r: rr, s: Math.random(), sp: 0.3+Math.random()*1.2 });
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const vw = Math.max(320, innerWidth||0), vh = Math.max(240, innerHeight||0);
  W = cv.width = Math.floor(vw*DPR);
  H = cv.height = Math.floor(vh*DPR);
  cv.style.width = vw+'px'; cv.style.height = vh+'px';
  CX = W/2; CY = H/2; R = Math.min(W,H)*0.285;
}
addEventListener('resize', resize);
resize();

let energy=0, spin=0, yaw=0, tilt=0.30;

function bandAt(u) {
  const f = Math.min(BANDS-1, Math.max(0, u*(BANDS-1)));
  const i = Math.floor(f), fr = f-i;
  return (bandS[i]||0)*(1-fr) + (bandS[Math.min(i+1,BANDS-1)]||0)*fr;
}

/* 정점 계산 — 구를 변형해 물결치는 껍질을 만든다 */
function buildMesh(t) {
  const cy0 = Math.cos(yaw), sy0 = Math.sin(yaw);
  const ct0 = Math.cos(tilt), st0 = Math.sin(tilt);
  const FOC = R*4.2;
  const amp = 0.5 + energy*1.35;

  for (let v=0; v<NV; v++) {
    const phi = (v/(NV-1))*Math.PI;            // 0..π
    const sp = Math.sin(phi), cp = Math.cos(phi);
    const eq = sp;                              // 적도에서 파형이 가장 크다
    for (let u=0; u<NU; u++) {
      const th = (u/NU)*6.2832;
      // 다중 파형 — 서로 다른 주기가 겹쳐 유기적으로 일렁인다
      let w = 0.050*Math.sin(3*th + 0.62*t + 1.7*phi)
            + 0.038*Math.sin(5*th - 0.47*t + 2.3*phi)
            + 0.027*Math.sin(2*th + 0.93*t + 3.1*phi)
            + 0.019*Math.sin(7*th + 0.78*t - 1.2*phi)
            + 0.013*Math.sin(11*th - 1.15*t + 0.6*phi);
      // 음파: 각도에 따라 다른 주파수 대역이 껍질을 밀어낸다
      const uu = u/NU;
      const aud = bandAt(uu < 0.5 ? uu*2 : (1-uu)*2);
      w += aud*(0.085 + energy*0.20);

      const rr = R * (1 + w*(0.45 + eq*0.95)*amp);

      let x = rr*sp*Math.cos(th);
      let y = rr*cp*0.88;                       // 살짝 눌린 구 → 돔 느낌
      let z = rr*sp*Math.sin(th);

      // yaw
      const x1 = x*cy0 - z*sy0;
      const z1 = x*sy0 + z*cy0;
      // tilt
      const y1 = y*ct0 - z1*st0;
      const z2 = y*st0 + z1*ct0;

      const persp = FOC/(FOC - z2);
      const i = v*NU+u;
      VX[i]=x1; VY[i]=y1; VZ[i]=z2;
      SXa[i] = CX + x1*persp;
      SYa[i] = CY + y1*persp;
      SD[i] = Math.max(0, Math.min(1, (z2/(R*1.15)+1)*0.5));
    }
  }
}

/* 깊이별 알파를 버킷으로 묶어 한 번에 그린다 (상태 변경 최소화) */
const NBUCKET = 12;
const bucketPath = [];
function strokeMesh(t) {
  for (let b=0;b<NBUCKET;b++) bucketPath[b] = null;

  const push = (b, x0,y0,x1,y1) => {
    let p = bucketPath[b];
    if (!p) { p = bucketPath[b] = new Path2D(); }
    p.moveTo(x0,y0); p.lineTo(x1,y1);
  };

  // 위도 링 (가로 방향)
  for (let v=0; v<NV; v++) {
    for (let u=0; u<NU; u++) {
      const i = v*NU+u, j = v*NU+((u+1)%NU);
      const d = (SD[i]+SD[j])*0.5;
      const b = Math.min(NBUCKET-1, Math.floor(d*NBUCKET));
      push(b, SXa[i],SYa[i], SXa[j],SYa[j]);
    }
  }
  // 경선 (세로 방향) — 일부만 그려 격자가 답답해지지 않게
  for (let u=0; u<NU; u+=2) {
    for (let v=0; v<NV-1; v++) {
      const i = v*NU+u, j = (v+1)*NU+u;
      const d = (SD[i]+SD[j])*0.5;
      const b = Math.min(NBUCKET-1, Math.floor(d*NBUCKET));
      push(b, SXa[i],SYa[i], SXa[j],SYa[j]);
    }
  }

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (let b=0;b<NBUCKET;b++) {
    const p = bucketPath[b]; if (!p) continue;
    const d = (b+0.5)/NBUCKET;                       // 0=뒤, 1=앞
    // 뒷면은 어둡고 얇게, 앞면은 밝고 굵게 → 속이 비치는 입체감
    const a = (0.014 + Math.pow(d,2.3)*0.30) * (0.45 + energy*1.25);
    const lw = (0.35 + d*1.5) * DPR;
    const hue = 168 + d*14;
    const lig = 45 + d*35;
    ctx.strokeStyle = 'hsla('+hue+',85%,'+lig+'%,'+a+')';
    ctx.lineWidth = lw;
    ctx.stroke(p);
  }
  ctx.lineCap = 'butt';
}

/* 껍질 안쪽 코어 — 동심원 격자 디스크 + 반짝임 */
function drawCore(t) {
  const e = energy;
  const cr = R*0.40;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(CX, CY);
  ctx.scale(1, Math.cos(tilt)*0.92 + 0.08);          // 기울어진 원판처럼

  // 광휘
  const g = ctx.createRadialGradient(0,0,0,0,0,cr*1.9);
  g.addColorStop(0,'rgba(120,255,235,'+(0.11+e*0.17)+')');
  g.addColorStop(0.45,'rgba(40,190,175,'+(0.05+e*0.07)+')');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,cr*1.9,0,6.2832); ctx.fill();

  // 동심원
  ctx.lineWidth = DPR;
  for (let i=1;i<=7;i++) {
    const rr = cr*(i/7);
    ctx.strokeStyle = 'rgba(110,240,220,'+(0.05+e*0.10)*(1-i*0.07)+')';
    ctx.beginPath(); ctx.arc(0,0,rr,0,6.2832); ctx.stroke();
  }
  // 방사 격자
  const rot = t*0.10;
  ctx.strokeStyle = 'rgba(110,240,220,'+(0.045+e*0.085)+')';
  for (let k=0;k<24;k++) {
    const a = k*0.2618 + rot;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*cr*0.14, Math.sin(a)*cr*0.14);
    ctx.lineTo(Math.cos(a)*cr, Math.sin(a)*cr);
    ctx.stroke();
  }
  // 겹치는 원 (생명의 꽃 패턴)
  ctx.strokeStyle = 'rgba(130,250,230,'+(0.04+e*0.08)+')';
  for (let k=0;k<6;k++) {
    const a = k*1.0472 - rot*0.6;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*cr*0.33, Math.sin(a)*cr*0.33, cr*0.33, 0, 6.2832);
    ctx.stroke();
  }

  // 중심 반짝임
  for (const s of SPECK) {
    const tw = 0.35 + 0.65*Math.abs(Math.sin(t*s.sp + s.s*9));
    const aud = bandAt(s.r);
    const rr = cr*s.r*(0.55 + aud*0.5);
    const a = (0.10 + e*0.5) * tw * (1 - s.r*0.55);
    if (a < 0.02) continue;
    const x = Math.cos(s.a + t*0.05)*rr, y = Math.sin(s.a + t*0.05)*rr;
    const sz = (0.6 + tw*1.5 + aud*1.6)*DPR;
    ctx.fillStyle = 'rgba('+Math.round(160+70*tw)+',255,'+Math.round(225+25*tw)+','+Math.min(0.9,a)+')';
    ctx.fillRect(x-sz*0.5, y-sz*0.5, sz, sz);
  }
  ctx.restore();
}

function frame(ts) {
  const t = ts/1000;
  const wantW = Math.floor(Math.max(320, innerWidth||0)*DPR);
  if (wantW !== W) resize();

  for (let i=0;i<BANDS;i++) {
    const tg = band[i]||0;
    bandS[i] += (tg-bandS[i]) * (tg>bandS[i] ? 0.45 : 0.10);
  }
  levelS += (level-levelS)*(level>levelS?0.35:0.07);
  wordPulse *= 0.90;

  let tE, tS;
  if (S.mode==='speak')       { tE = 0.60 + levelS*0.80 + wordPulse*0.32; tS = 0.30; }
  else if (S.mode==='think')  { tE = 0.44 + 0.15*Math.sin(t*3.0);          tS = 0.72; }
  else if (S.mode==='listen') { tE = 0.28 + levelS*0.70;                   tS = 0.16; }
  else                        { tE = 0.15 + levelS*0.26;                   tS = 0.07; }
  energy += (Math.min(1.1,tE)-energy)*0.10;
  spin += (tS-spin)*0.05;
  yaw += 0.0011 + spin*0.0055;
  tilt = 0.30 + 0.045*Math.sin(t*0.17);

  // 배경
  const bg = ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*0.72);
  bg.addColorStop(0,'#02100f');
  bg.addColorStop(0.55,'#010a0a');
  bg.addColorStop(1,'#000403');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  buildMesh(t);

  // 뒷면 → 코어 → 앞면 순서로 겹쳐 속이 비치게 한다
  strokeMesh(t);
  drawCore(t);

  // 비네트
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(CX,CY,R*1.05,CX,CY,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,4,4,0.80)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ─────────── interactions ─────────── */
let uiTimer=null;
function showUI(){ document.body.classList.add('showui'); clearTimeout(uiTimer); uiTimer=setTimeout(()=>document.body.classList.remove('showui'),2600); }
addEventListener('mousemove', showUI);

cv.addEventListener('click', () => {
  if ($('sheet').classList.contains('on')) return;
  if (S.mode==='speak') { stopSpeaking(); return; }
  wake();
});
function syncMicBtn(){ $('b-mic').classList.toggle('off', !S.wakeOn); }
$('b-mic').onclick = e => { e.stopPropagation(); S.wakeOn=!S.wakeOn;
  if (S.wakeOn){ startSTT(); cap('웨이크워드 대기 중',true);} else { stopSTT(); cap('대기 해제',true);} syncMicBtn(); };
$('b-new').onclick = async e => { e.stopPropagation();
  try { await fetch(bridgeURL()+'/reset',{method:'POST'}); cap('새 대화를 시작합니다',true); }
  catch(err){ cap('두뇌가 연결되지 않았습니다',true); } };
$('b-set').onclick = e => { e.stopPropagation(); openSheet(); };

function openSheet() {
  $('s-hon').value=CFG.honorific; $('s-wake').value=CFG.wake;
  $('s-rate').value=String(CFG.rate); $('s-pitch').value=String(CFG.pitch);
  $('s-clap').value=CFG.clap?'1':'0'; $('s-bridge').value=CFG.bridge||'';
  loadVoices(); $('sheet').classList.add('on');
}
$('s-test').onclick = () => {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('안녕하십니까. 자비스입니다. 무엇을 도와드릴까요.');
  const v = voices.find(x=>x.name===$('s-voice').value);
  if (v) { u.voice=v; u.lang=v.lang; } else u.lang='ko-KR';
  u.rate=parseFloat($('s-rate').value); u.pitch=parseFloat($('s-pitch').value);
  speechSynthesis.speak(u);
};
$('s-close').onclick = () => $('sheet').classList.remove('on');
$('sheet').onclick = e => { if (e.target===$('sheet')) $('sheet').classList.remove('on'); };
$('s-save').onclick = async () => {
  CFG.honorific = $('s-hon').value.trim()||'보스';
  CFG.wake = $('s-wake').value.trim()||'자비스';
  CFG.rate = parseFloat($('s-rate').value);
  CFG.pitch = parseFloat($('s-pitch').value);
  CFG.voiceName = $('s-voice').value;
  CFG.clap = $('s-clap').value==='1';
  CFG.bridge = $('s-bridge').value.trim();
  saveCfg(); $('sheet').classList.remove('on');
  cap('설정을 저장했습니다', true);
  await checkBridge();
};

/* ─────────── boot ─────────── */
(async function boot() {
  loadVoices(); initSTT(); syncMicBtn(); showUI(); badge();
  const ok = await checkBridge();
  await initAudio(); clapWatch();
  const h = new Date().getHours();
  const greet = h<5?'늦은 밤까지 고생 많으십니다':h<12?'좋은 아침입니다':h<18?'좋은 오후입니다':'좋은 저녁입니다';
  if (ok) {
    S.wakeOn=true; startSTT(); syncMicBtn();
    cap(greet+', '+CFG.honorific, true);
    speak(greet+', '+CFG.honorific+'. 자비스 대기 중입니다.');
  } else {
    cap('내 컴퓨터에서 JARVIS 실행 파일을 켜면 두뇌가 연결됩니다.');
  }
  setInterval(() => { if (!S.busy) checkBridge(); }, 15000);
})();
</script>
